name: CI

# Trigger on pushes to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token for a build/test job.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  # Ephemeral PostgreSQL connection string used by Prisma + tests.
  # 127.0.0.1 is more reliable than "localhost" in CI networking.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dukaanos?schema=public
  # Non-secret CI placeholders. For anything real, move to
  # Settings -> Secrets and reference as ${{ secrets.AUTH_SECRET }} etc.
  AUTH_SECRET: ci-placeholder-secret-not-for-production
  NEXTAUTH_SECRET: ci-placeholder-secret-not-for-production
  NEXTAUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  CRON_SECRET: ci-placeholder-cron-secret-not-for-production
  VAPID_SUBJECT: mailto:ci@example.com

jobs:
  build-and-test:
    name: Build, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Ephemeral PostgreSQL for the test steps.
    # NOTE: there is no official `actions/setup-postgres` action. The
    # `actions/setup-*` family covers node/python/java/dotnet/go, but not
    # Postgres. A service container is the GitHub-recommended, dependency-free
    # way to get a throwaway database that is torn down automatically on exit.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dukaanos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dukaanos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          # Pinned to 22.x (LTS) and aligned with engines/package.json
          # (">=22.12.0") so local == CI.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci
        # npm ci fails if package.json and package-lock.json are out of sync.
        # If this step fails, run `npm install` locally and commit the lockfile.

      # --- The #1 classic CI failure: the job starts before Postgres is ready.
      # GitHub does NOT wait for the healthcheck; we poll an actual connection.
      - name: Wait for PostgreSQL to be ready
        run: |
          set -euo pipefail
          echo "Waiting for PostgreSQL on 127.0.0.1:5432 ..."
          for i in $(seq 1 30); do
            if node -e "const{Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.end();})().catch(e=>{console.error(e.message);process.exit(1)})" 2>/dev/null; then
              echo "PostgreSQL is ready (attempt $i)."
              exit 0
            fi
            echo "  not ready yet (attempt $i/30)..."
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready within 60s"
          exit 1

      # --- Correct order: validate (cheap schema check) BEFORE generate,
      # because typecheck/build need the generated client types.
      - name: Validate Prisma schema
        run: |
          set -euo pipefail
          npm run prisma:validate || { echo "::error::prisma validate failed - check schema.prisma"; exit 1; }

      - name: Generate Prisma Client
        run: |
          set -euo pipefail
          npm run prisma:generate || { echo "::error::prisma generate failed"; exit 1; }

      - name: Typecheck
        run: |
          set -euo pipefail
          npm run typecheck || { echo "::error::TypeScript typecheck failed"; exit 1; }

      - name: Lint
        run: |
          set -euo pipefail
          npm run lint || { echo "::error::ESLint reported errors"; exit 1; }

      # --- DB-dependent steps. Migrations must be applied before tests run.
      - name: Apply database migrations
        run: |
          set -euo pipefail
          npm run prisma:migrate:deploy || { echo "::error::prisma migrate deploy failed - migrations may be out of sync"; exit 1; }

      - name: Run tests
        run: |
          set -euo pipefail
          npm test || { echo "::error::Tests failed"; exit 1; }

      - name: Build (Next.js production)
        run: |
          set -euo pipefail
          npm run build || { echo "::error::next build failed"; exit 1; }

      # --- Clear, centralized failure report when anything above breaks.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::error::CI pipeline failed - see the step logs above for details."
          echo "Node: $(node -v)   npm: $(npm -v)"
          echo "--- Prisma ---"
          npx prisma -v || true
          echo "--- Postgres reachability ---"
          node -e "const{Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();const r=await c.query('select version()');console.log(r.rows[0].version);await c.end();})().catch(e=>{console.error('DB check failed:',e.message);})" || true
