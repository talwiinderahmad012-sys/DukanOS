<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | DukaanOS</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f9fafb; color: #111827; text-align: center; padding: 1rem; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        p { color: #6b7280; max-width: 400px; line-height: 1.5; }
        .btn { margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #2563eb; color: white; border: none; border-radius: 0.5rem; cursor: pointer; text-decoration: none; font-weight: 500; font-size: 1rem; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <h1>You are offline</h1>
    <p>Please check your internet connection. Point-of-Sale operations will continue working offline and sync automatically when connection is restored.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
